<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — E.C.Balázs</title>
<meta name="description" content="Contact Emma Balázs.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>/* E.C.Balázs — one white page system. Layout: a narrow text column, images full column width, nothing centered but the image. */
:root{
  --bg:#ffffff; --fg:#111111; --mute:#6b6b6b; --rule:#e6e6e6; --link:#111111;
  --serif:"EB Garamond", Georgia, "Times New Roman", serif;
  --font:var(--serif); --size:1.2rem; --measure:34rem;
}
html{ background:var(--bg); color:var(--fg); color-scheme:light; }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:var(--size); line-height:1.5;
  padding-block:1.5rem 4rem; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.wrap{ max-width:52rem; margin:0 auto; }
a{ color:var(--link); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:0.18em; text-decoration-color:#bdbdbd; }
a:hover, a:focus-visible{ text-decoration-color:var(--fg); }
a:focus-visible{ outline:1px solid var(--fg); outline-offset:3px; }
header.top{ display:flex; flex-wrap:wrap; gap:0.6rem 1.6rem; align-items:baseline; justify-content:space-between; margin-bottom:2.5rem; }
header.top .name{ font-size:1.05em; text-decoration:none; letter-spacing:0.01em; }
header.top nav{ display:flex; flex-wrap:wrap; gap:0 1.3rem; font-size:0.86em; }
header.top nav a{ text-decoration:none; color:var(--mute); }
header.top nav a[aria-current]{ color:var(--fg); }
header.top nav a:hover{ color:var(--fg); }
main{ display:grid; gap:2.2rem; }
main p{ max-width:var(--measure); margin:0; }
main p + p{ margin-top:1em; }
h1{ font-weight:400; font-size:1.35em; margin:0; max-width:var(--measure); text-wrap:balance; line-height:1.3; }
footer{ margin-top:5rem; font-size:0.78em; color:var(--mute); }

/* Contact form: same column, same type, the lightest possible chrome. */
form.contact{ max-width:var(--measure); display:grid; gap:1.4rem; margin-top:0.4rem; }
form.contact label{ display:grid; gap:0.35rem; font-size:0.86em; color:var(--mute); }
form.contact input, form.contact textarea{
  font:inherit; font-size:1.2rem; color:var(--fg); background:transparent;
  border:0; border-bottom:1px solid var(--rule); border-radius:0; padding:0.3em 0; width:100%; box-sizing:border-box; }
form.contact textarea{ min-height:7.5em; resize:vertical; line-height:1.5; }
form.contact input:focus, form.contact textarea:focus{ outline:none; border-bottom-color:var(--fg); }
form.contact button{
  font:inherit; font-size:1rem; color:var(--fg); background:transparent; cursor:pointer;
  border:1px solid var(--fg); border-radius:0; padding:0.45em 1.3em; justify-self:start; margin-top:0.4rem; }
form.contact button:hover, form.contact button:focus-visible{ background:var(--fg); color:var(--bg); outline:none; }
form.contact button[disabled]{ opacity:0.5; cursor:default; }
form.contact .hp{ display:none !important; }
.note{ font-size:0.86em; color:var(--mute); max-width:var(--measure); }
@media (prefers-reduced-motion:no-preference){ a, form.contact button{ transition:all .15s; } }
</style>

<script data-goatcounter="https://ecbalazs.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
<header class="top"><a class="name" href="index.html">E.C.Balázs</a><nav><a href="about.html">About</a><a href="museum.html">Museum</a><a href="film.html">Film</a><a href="consulting.html">Consulting</a><a href="contact.html" aria-current="page">Contact</a></nav></header>
<main>
<h1>Contact</h1>
<div>
<p>I'd be glad to hear from you about my work, the museum, the films, or a possible collaboration.</p>
</div>

<!-- FORMSPREE: replace YOUR_FORM_ID below with the id Formspree gives you (the part after /f/). -->
<form class="contact" id="contact-form" action="https://formspree.io/f/mqpenror" method="POST">
  <label>Name
    <input type="text" name="name" autocomplete="name" required>
  </label>
  <label>Email
    <input type="email" name="email" autocomplete="email" required>
  </label>
  <label>Message
    <textarea name="message" required></textarea>
  </label>
  <input type="hidden" name="_subject" value="Message from ecbalazs.com">
  <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="submit">Send</button>
</form>
<p class="note" id="form-note" hidden></p>

<script>
(function(){
  var f=document.getElementById('contact-form'), n=document.getElementById('form-note');
  if(!f||!window.fetch) return; /* without fetch, the form posts the ordinary way */
  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    var b=f.querySelector('button'); b.disabled=true; b.textContent='Sending…';
    fetch(f.action,{method:'POST',body:new FormData(f),headers:{'Accept':'application/json'}})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r); })
    .then(function(){
      f.hidden=true; n.hidden=false;
      n.textContent='Thank you. Your message has been sent, and I will reply as soon as I can.';
    })
    .catch(function(){
      b.disabled=false; b.textContent='Send'; n.hidden=false;
      n.textContent='Something went wrong and the message was not sent. Please try again in a moment.';
    });
  });
})();
</script>
</main>
<footer>© E.C.Balázs</footer>
</div>

</body>
</html>
